<!DOCTYPE html>
<html>
  <head>
    <title>Game</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- scale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="side-menu" id="sideMenu">
      <div class="menu-header">
        <h2>Menu</h2>
        <button class="close-menu" id="closeMenu">×</button>
      </div>
      <div class="menu-content">
        <div>
          Made by
          <a target="_blank" href="https://x.com/heyarviind">@heyarviind</a>
        </div>
        <button class="menu-item">
          <span>❓ How to Play</span>
        </button>
      </div>
    </div>
    <div class="header">
      <div>
        <img
          src="icons/hamburger.svg"
          width="28px"
          alt="hamburger"
          id="menuButton"
          style="cursor: pointer"
        />
      </div>
      <div class="moves-left">Strokes: <span id="movesLeft">0</span></div>
      <div>
        <img
          src="icons/refresh.svg"
          width="28px"
          alt="refresh"
          id="refreshButton"
          style="cursor: pointer"
        />
      </div>
    </div>
    <div class="game-container">
      <canvas></canvas>
    </div>

    <div class="dice-container">
      <button id="diceButton" class="dice-button">🎲 Roll!</button>
      <div id="diceResult" class="dice-result">?</div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
