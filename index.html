<!DOCTYPE html>
<html>
  <head>
    <title>Mini Golf - MVPJoy.com</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- scale -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="A fun mini golf game with dice rolls" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://huntlie.com/script.js?id=9n7bv8f4reb83i8" async />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("ServiceWorker registration successful");
            })
            .catch((err) => {
              console.log("ServiceWorker registration failed: ", err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="side-menu" id="sideMenu">
      <div class="menu-header">
        <h2>Menu</h2>
        <button class="close-menu" id="closeMenu">×</button>
      </div>
      <div class="menu-content">
        <div>
          Made by
          <a target="_blank" href="https://x.com/heyarviind">@heyarviind</a>
        </div>
        <button class="menu-item" id="howToPlay">
          <span>❓ How to Play</span>
        </button>
        <a href="https://mvpjoy.com" target="_blank">
          <button class="menu-item" id="howToPlay">
            <span>🎁 Build Yours</span>
          </button>
        </a>
      </div>
    </div>
    <div class="header">
      <div>
        <img
          src="icons/hamburger.svg"
          width="28px"
          alt="hamburger"
          id="menuButton"
          style="cursor: pointer"
        />
      </div>
      <div class="moves-left">Strokes: <span id="movesLeft">0</span></div>
      <div>
        <img
          src="icons/refresh.svg"
          width="28px"
          alt="refresh"
          id="refreshButton"
          style="cursor: pointer"
        />
      </div>
    </div>
    <div class="game-container">
      <canvas></canvas>
    </div>

    <div class="dice-container">
      <button id="diceButton" class="dice-button">🎲 Roll!</button>
      <div id="diceResult" class="dice-result">?</div>
    </div>
    <script src="game.min.js"></script>
  </body>
</html>
